<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>PartyPad · 手机派对手柄</title>
  <link rel="stylesheet" href="./src/ui/style.css" />
</head>
<body>
  <div id="app">
    <!-- Pure Mobile Join Screen (No Host/Big-Screen option here) -->
    <section id="view-join" class="view active">
      <div class="join-card">
        <h1>PartyPad</h1>
        <p class="muted">扫码或手动输入 6 位房间码直连主机（进入后自动全屏横屏）</p>
        <input id="join-code" class="input code-input" maxlength="8" placeholder="6 位房间码" autocomplete="off" />
        <input id="join-name" class="input" maxlength="16" placeholder="你的昵称（可选）" />
        <button id="join-submit" class="btn primary full">进入全屏横屏手柄</button>
        <p id="join-error" class="error-text"></p>
      </div>
    </section>

    <!-- Fullscreen Landscape Active Mobile Controller -->
    <section id="view-pad" class="view">
      <header class="pad-bar">
        <div class="pad-info">
          <span id="pad-room-badge" class="badge">-----</span>
          <span id="pad-ping" class="badge muted-badge">-- ms</span>
        </div>
        <div class="pad-tools">
          <button id="pad-text-toggle" class="btn sm">输入文本</button>
          <button id="pad-imu-toggle" class="btn sm">体感: 关</button>
          <button id="pad-imu-calib" class="btn sm hidden">校准正面</button>
          <button id="pad-edit-toggle" class="btn sm">编辑布局</button>
          <button id="pad-settings-btn" class="btn sm">设置</button>
          <button id="pad-fs-btn" class="btn sm">全屏</button>
          <button id="pad-leave" class="btn sm ghost">退出</button>
        </div>
      </header>

      <!-- Edit Mode Add/Remove Controls Toolbar -->
      <div id="pad-edit-bar" class="edit-bar hidden">
        <span class="edit-hint">拖拽移动 · 右下角缩放 · 点×删除</span>
        <button id="add-joy-l" class="btn sm">+ 左摇杆</button>
        <button id="add-joy-r" class="btn sm">+ 右摇杆</button>
        <button id="add-btn" class="btn sm">+ 按键</button>
        <button id="add-dpad" class="btn sm">+ 十字键</button>
        <button id="add-text" class="btn sm">+ 文本输入</button>
        <button id="add-draw" class="btn sm">+ 绘板</button>
        <button id="pad-mirror" class="btn sm">左右镜像</button>
        <button id="pad-reset-layout" class="btn sm ghost">恢复默认</button>
      </div>

      <!-- Private Message Banner / Hold-to-Reveal Card -->
      <div id="pad-private-box" class="private-box hidden"></div>

      <!-- Settings Drawer (Live KCP Hot-Switch) -->
      <div id="pad-settings-drawer" class="settings-drawer hidden">
        <label class="check-row" style="margin:0">
          <input id="pad-kcp-switch" type="checkbox" />
          <strong>启用 KCP 传输优化（热切换，不断连）</strong>
        </label>
        <span id="pad-kcp-status" class="muted">当前：Dual-Channel WebRTC</span>
        <button id="pad-settings-close" class="btn sm ghost">收起</button>
      </div>

      <!-- Quick Text Input Drawer (Always available for party games) -->
      <div id="pad-text-drawer" class="text-drawer hidden">
        <input id="pad-text-input" class="input" maxlength="120" placeholder="输入回答、弹幕或私密内容…" />
        <button id="pad-text-send" class="btn primary">发送</button>
        <button id="pad-text-close" class="btn ghost">收起</button>
      </div>

      <!-- Dynamic Touch Stage -->
      <div id="pad-stage" class="pad-stage"></div>

      <!-- Gentle landscape hint when browser blocks orientation.lock (e.g. iOS Safari) -->
      <div id="rotate-hint" class="rotate-hint">
        <span>📱 建议将手机横屏握持以获得最佳手柄体验</span>
        <button id="rotate-dismiss" class="btn sm">知道了</button>
      </div>
    </section>
  </div>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
